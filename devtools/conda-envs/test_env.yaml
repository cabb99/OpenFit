name: test
channels:
  - conda-forge
dependencies:
    # Base
  - python
  - pip

    # Core run-time dependencies
  - numpy
  - scipy
  - numba

    # Optional features exercised by the test suite
  - openmm
  - mrcfile
  - mdtraj
  - matplotlib
  - pyyaml

    # Testing
  - pytest
  - pytest-cov

    # Linting / formatting (also run by the CI lint job and pre-commit)
  - flake8
  - black

    # OpenSMOG structure-based-model runtime (Fit.from_smog). The from_smog_structure
    # generator additionally needs the external SMOG 2 tool, which is not installable here.
  - pip:
      - OpenSMOG
    # MolScene (PDB/Scene workflow) and OpenAWSEM are kept commented: MolScene is
    # not yet published, and OpenAWSEM is heavy + git-only (PyPI 1.1.1 breaks on
    # Biopython >= 1.80). Their tests skip when absent.
    #  - git+https://github.com/cabb99/molscene
    #  - git+https://github.com/npschafer/openawsem
